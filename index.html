<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
<main>


<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      font-family: Arial, sans-serif;
      background: #fff;
    }
 
   
    header {
      background-color: #0f172a;
      display: flex;
      align-items: center;
      padding: 110px 220px;
      font-size: 40px;
    }
 
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 30px;
      font-weight: bold;
      border-right: 3px solid #e8a020;
      padding-right: 16px;
    }
 
    .logo img {
      width: 48px;
      height: 48px;
    }
 
    .header-title {
      flex: 1;
      text-align: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
    }
 
   
    main {
      padding: 40px 60px;
    }
 
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.8fr 1fr;
      gap: 24px;
      align-items: center;
    }
 
    .left-cards,
    .right-cards {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
 
    .card {
      border: 2px solid #222;
      padding: 24px 20px;
      text-align: center;
      font-size: 18px;
      line-height: 1.5;
      border-radius: 2px;
    }
 
    .train-image {
      width: 100%;
      border-radius: 4px;
      display: block;
    }
 
   
    .links {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-top: 48px;
    }
 
    .links a {
      color: #1a3a8f;
      font-size: 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
 
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
 
  <header>
    <div class="logo">
      <span></span>
      <span>Ferrorama</span>
    </div>
    <div class="header-title">Monitoramento de Sensores</div>
  </header>
 
  <main>
    <div class="grid">
 
      
      <div class="left-cards">
        <div class="card">
          Dados em tempo real<br>&lt; 2s
        </div>
        <div class="card">
          Carregamento de listagens<br>24/7
        </div>
      </div>
 
      
      <div>
        <img
          class="train-image"
          src="images/WhtTMFRN-trembala.webp"
          alt="Trem de alta velocidade na estação"
        />
      </div>
 
      
      <div class="right-cards">
        <div class="card">
          Gestão de sensores
        </div>
        <div class="card">
          Monitoramento<br>contínuo
        </div>
      </div>
 
    </div>
 
    
    <div class="links">
      <a href="signup.html">↗Cadastrar-se</a>
      <a href="sigin.html">↗ Acessar o sistema</a>
    </div>
  </main>















</main>









</body>
</html>
