
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Train</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background-color:#ffffff;
}

/* Cabeçalho */
header{
    background:#003f99;
    color:white;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.logo{
    position:absolute;
    left:20px;
    text-align:center;
}

.logo img{
    width:90px;
}

.logo p{
    color:black;
    font-size:22px;
}

header h1{
    font-size:40px;
}

/* Conteúdo */
.container{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:50px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:50px;
}

.btn{
    width:350px;
    height:100px;
    border:3px solid black;
    border-radius:50px;
    background:white;
    font-size:20px;
    cursor:pointer;
}

.btn:hover{
    background:#dcdcdc;
}

.imagem img{
    width:600px;
    border-radius:5px;
}
</style>
</head>
<body>

<header>
    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/713/713311.png" alt="Trem">
        <p>Time Train</p>
    </div>

    <h1>Vamos lá!</h1>
</header>

<div class="container">

    <div class="menu">
        <button class="btn">Cadastrar Item</button>
        <button class="btn">Monitorar Item</button>
   
    </div>

    <div class="imagem">
        <img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3" alt="Trem">
    </div>

</div>

</body>
</html>
