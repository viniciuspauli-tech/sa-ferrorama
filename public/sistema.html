<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Train - Selecione uma categoria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body { background-color: #ececec; }

        /* Header igual ao da imagem 2 */
        header {
            background: #0f172a;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 {
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        /* Conteúdo centralizado */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            padding: 80px 60px;
        }

        /* Cards iguais ao botão "Sensor" da imagem 2 */
        .card-btn {
            width: 240px;
            height: 95px;
            border: 3px solid black;
            border-radius: 22px;
            background: white;
            font-size: 22px;
            cursor: pointer;
            text-decoration: none;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            transition: background 0.2s;
        }

        .card-btn:hover {
            background: #dcdcdc;
        }
    </style>
</head>
<body>

    <header>
        <h1>Selecione uma categoria</h1>
    </header>

    <div class="container">
        <a class="card-btn" href="sensor.html">Sensor</a>
        <a class="card-btn" href="cadastro_item.html">Cadastrar Sensor</a>
    </div>

</body>
</html>
